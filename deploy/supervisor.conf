; Mantém a fila rodando. Copie para /etc/supervisor/conf.d/olavo-digital.conf
[program:olavo-queue]
command=php /var/www/olavo-digital/apps/api/artisan queue:work --sleep=3 --tries=3 --max-time=3600
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=620
stdout_logfile=/var/log/olavo-queue.log
redirect_stderr=true
