# Exemplo para Ubuntu com PHP-FPM 8.3. Troque plataforma.exemplo.com.br pelo domínio real.
server {
    listen 80;
    server_name plataforma.exemplo.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name plataforma.exemplo.com.br;

    ssl_certificate     /etc/letsencrypt/live/plataforma.exemplo.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plataforma.exemplo.com.br/privkey.pem;

    root /var/www/olavo-digital/apps/web/dist;
    index index.html;

    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; media-src 'self' blob: https:; connect-src 'self' https:; worker-src 'self' blob:; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/(api|sanctum|up) {
        root /var/www/olavo-digital/apps/api/public;
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        root /var/www/olavo-digital/apps/api/public;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location /storage/ {
        root /var/www/olavo-digital/apps/api/public;
        expires 30d;
    }

    location / {
        try_files $uri /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
